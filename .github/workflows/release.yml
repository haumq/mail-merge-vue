name: "Publish Cross-Platform Release"

on:
  workflow_dispatch: # 👈 Thêm dòng này để cho phép kích hoạt bằng tay trên GitHub
  push:
    tags:
      - 'v*' # Chạy tự động khi bạn push tag dạng v1.0.0, v1.0.1...

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Build cho macOS (Intel + Apple Silicon)
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04' # Build cho Linux (.deb & .AppImage)
            args: ''
          - platform: 'windows-latest' # Build cho Windows (.exe & .msi)
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GMAIL_CLIENT_ID: ${{ secrets.VITE_GMAIL_CLIENT_ID }}
          VITE_OUTLOOK_CLIENT_ID: ${{ secrets.VITE_OUTLOOK_CLIENT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Mail Merge Pro ${{ github.ref_name }}'
          releaseBody: 'Xem danh sách thay đổi chi tiết tại commit log.'
          releaseDraft: true
          prerelease: false
          uploadPlainBinary: true # 👈 Bật tính năng đẩy thêm file .exe Portable chạy trực tiếp
          args: ${{ matrix.args }}